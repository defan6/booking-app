spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5442/orders_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      platform: postgres
server:
  port: 8083
